<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arpit | Graphics team - TechXtract</title>
    <meta name="description" content="Arpit — Graphics team, TechXtract Technical Society.">
    <meta name="theme-color" content="#06080d">

    <!-- Preload critical hero image -->
    <link rel="preload" as="image" href="arpit-portrait.webp" type="image/webp" fetchpriority="high">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cyber Background Elements -->
    <div class="tech-bg">
        <div class="grid-overlay"></div>
        <div class="ambient-orb orb-cyan"></div>
        <div class="ambient-orb orb-gold"></div>
    </div>

    <!-- Top Navigation Header -->
    <header class="top-header">
        <a href="#" class="brand-badge" aria-label="TechXtract">
            <div class="brand-logo-hex">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            <span class="brand-title">TECHXTRACT</span>
        </a>
    </header>

    <!-- Main Showcase Section -->
    <main class="main-wrapper">
        <article class="member-card">
            <!-- Decorative Sci-Fi Brackets (Cyan & Gold) -->
            <div class="bracket top-left"></div>
            <div class="bracket top-right"></div>
            <div class="bracket bottom-left"></div>
            <div class="bracket bottom-right"></div>

            <!-- LEFT COLUMN: Picture & Dual Rotating Rings -->
            <section class="portrait-bay" aria-label="Member Portrait">
                <div class="portrait-stage">
                    <!-- Dual Counter-Rotating Rings (Clockwise Cyan + Counter-Clockwise Gold) -->
                    <div class="holo-ring"></div>
                    <div class="holo-ring-inner"></div>

                    <!-- Cutout Portrait with Ultra-Fast WebP & Fallback -->
                    <picture class="portrait-picture">
                        <source srcset="arpit-portrait.webp" type="image/webp">
                        <img 
                            src="arpit-portrait.png" 
                            onerror="this.onerror=null; this.src='arpit-portrait.png';"
                            alt="Arpit - Graphics team" 
                            class="portrait-img"
                            loading="eager"
                            fetchpriority="high"
                            decoding="async"
                            width="397"
                            height="750"
                        >
                    </picture>

                    <!-- Cyber Pedestal Fade -->
                    <div class="pedestal-fade"></div>
                    <div class="pedestal-line"></div>
                </div>
            </section>

            <!-- RIGHT COLUMN: Information (Open & Unboxed) -->
            <section class="info-bay">
                <!-- Member Name -->
                <h1 class="member-name">Arpit</h1>

                <!-- Designation: Plain Text (No Box) -->
                <p class="member-position">Graphics team</p>

                <!-- Branch & Batch (Unboxed Open Spec Row) -->
                <div class="meta-row">
                    <div class="meta-item">
                        <span class="meta-label">Branch</span>
                        <span class="meta-value">CST</span>
                    </div>
                    <span class="meta-divider" aria-hidden="true">&bull;</span>
                    <div class="meta-item">
                        <span class="meta-label">Batch</span>
                        <span class="meta-value">2024–2028</span>
                    </div>
                </div>

                <!-- Connect Links -->
                <div class="social-grid">
                    <!-- LinkedIn Link -->
                    <a 
                        href="https://www.linkedin.com/in/arpit-singh-564788327quofdg" 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        class="social-btn btn-linkedin"
                        title="Connect with me on LinkedIn"
                    >
                        <svg class="brand-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9h2.77v8.37H6.46v-8.37M7.85 6.25a1.62 1.62 0 1 0 0 3.24 1.62 1.62 0 0 0 0-3.24Z"/>
                        </svg>
                        <span class="btn-label">Connect with me on LinkedIn</span>
                        <svg class="btn-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M7 17l9.2-9.2M17 17V8H8"/>
                        </svg>
                    </a>
                </div>

                <!-- Quote: Bottom of Section (Unboxed) -->
                <div class="quote-bottom">
                    <p class="quote-text">&ldquo;Cause it's a bitter sweet symphony&rdquo;</p>
                </div>
            </section>
        </article>
    </main>

    <!-- Page Footer -->
    <footer class="page-footer">
        <p class="footer-text">&copy; 2026 <span>TechXtract</span></p>
    </footer>

    <!-- Reliable Mobile & QR-Scanner Link Opening Script -->
    <script>
        document.querySelectorAll('a.social-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (window.matchMedia && window.matchMedia('(max-width: 768px)').matches);
                if (isMobile) {
                    e.preventDefault();
                    window.location.href = this.href;
                }
            });
        });
    </script>

</body>
</html>
